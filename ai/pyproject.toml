[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiosk-ai"
version = "0.1.0"
description = "Module AI của AI eGate: QR, khuôn mặt, liveness"
requires-python = ">=3.12"
dependencies = [
  "mediapipe>=1.2,<2",
  "numpy>=2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kiosk_ai*"]

[tool.setuptools.package-data]
kiosk_ai = ["thresholds.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: test nạp model nặng, bỏ qua trong CI thường"]
